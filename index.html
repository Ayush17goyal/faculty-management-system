    body {
      font-family: "Times New Roman", Times, serif;
      background-color: #ffffff;
      color: #000000;
      margin: 20px 30px;
      font-size: 15px;
    }
    h2 {
      font-size: 24px;
      margin: 0 0 4px 0;
      font-weight: bold;
    }
    h3 {
      font-size: 19px;
      margin: 0 0 12px 0;
      font-weight: bold;
    }
    h4 {
      font-size: 16px;
      margin: 15px 0 6px 0;
      font-weight: bold;
    }
    a {
      color: #0000ee;
      text-decoration: underline;
      cursor: pointer;
    }
    a:visited {
      color: #551a8b;
    }
    .header-bar {
      border-bottom: 1px solid #888888;
      padding-bottom: 10px;
      margin-bottom: 18px;
    }
    .layout-container {
      display: flex;
      min-height: 520px;
    }
    .sidebar {
      width: 160px;
      border-right: 1px solid #888888;
      padding-right: 15px;
      flex-shrink: 0;
    }
    .sidebar-menu {
      margin-top: 5px;
    }
    .sidebar-item {
      margin-bottom: 10px;
      font-size: 15px;
    }
    .sidebar-item a {
      text-decoration: underline;
    }
    .sidebar-item.active a {
      font-weight: bold;
      color: #000000;
    }
    .sidebar-logout {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #cccccc;
    }
    .main-content {
      flex-grow: 1;
      padding-left: 25px;
    }
    table.data-table {
      border-collapse: collapse;
      border: 1px solid #888888;
      margin-top: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #888888;
      padding: 4px 10px;
      text-align: left;
    }
    table.data-table th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    table.form-table {
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 14px;
    }
    table.form-table td {
      padding: 5px 8px;
      vertical-align: middle;
      border: none;
    }
    input[type="text"], input[type="password"], input[type="email"], select, textarea {
      font-family: inherit;
      font-size: 14px;
      padding: 2px 4px;
      border: 1px solid #777777;
    }
    input[type="submit"], button, .btn {
      font-family: inherit;
      font-size: 13px;
      padding: 2px 10px;
      cursor: pointer;
    }
    .msg-banner {
      color: #006600;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .err-banner {
      color: #cc0000;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .login-container {
      width: 420px;
      margin: 80px auto 0 auto;
      text-align: center;
    }
    .stat-box {
      border: 1px solid #888888;
      display: inline-block;
      padding: 10px 20px;
      margin-right: 15px;
      margin-bottom: 15px;
      min-width: 130px;
      background-color: #fafafa;
    }
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-box {
      background: #ffffff;
      padding: 20px 25px;
      border: 1px solid #333333;
      max-width: 500px;
      width: 100%;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    function loadData() {
      const stored = localStorage.getItem('fms_app_data_v2');
      if (stored) {
        try { return JSON.parse(stored); } catch(e) {}
      }
      localStorage.setItem('fms_app_data_v2', JSON.stringify(DEFAULT_DATA));
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    let state = loadData();
    let currentRoute = window.location.hash.slice(1) || 'faculty/dashboard';
    let bannerMessage = '';
    let bannerError = '';

    function saveData() {
      localStorage.setItem('fms_app_data_v2', JSON.stringify(state));
    }

    function notify(msg, isError = false) {
      if (isError) bannerError = msg;
      else bannerMessage = msg;
      render();
    }

    function clearBanners() {
      bannerMessage = '';
      bannerError = '';
    }

    function navigate(route) {
      currentRoute = route;
      window.location.hash = '#' + route;
      clearBanners();
      render();
    }

    window.addEventListener('hashchange', () => {
      const h = window.location.hash.slice(1);
      if (h && h !== currentRoute) {
        currentRoute = h;
        render();
      }
    });

                <td>
                  <select id="login-role" onchange="document.getElementById('login-username').value = '${defaultUsers['Admin']}'; updateLoginUser(this.value);" style="width: 170px;">

                    <option value="HOD">HOD</option>

                    <option value="Director">Director</option>

              <tr>

    function updateLoginUser(role) {
      const map = {
        Admin: ['admin01', 'admin123'],
        HOD: ['rahul01', 'rahul123'],
        Faculty: ['amit01', 'amit123'],
        Director: ['director01', 'director123'],
        VP: ['vp01', 'vp123'],
        President: ['president01', 'president123']
      };
      const creds = map[role] || ['admin01', 'admin123'];
      document.getElementById('login-username').value = creds[0];
      document.getElementById('login-password').value = creds[1];
    }

    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('login-role').value;
      const username = document.getElementById('login-username').value.trim();

      const user = state.users.find(u => u.username === username && u.role === role);
      if (user) {
        state.currentUser = { ...user };
        saveData();
        const routeMap = {
          Admin: 'admin/dashboard',
          HOD: 'hod/dashboard',
          Faculty: 'faculty/dashboard',
          Director: 'director/dashboard',
          VP: 'vp/dashboard',
          President: 'president/dashboard'
        };
        navigate(routeMap[role] || 'admin/dashboard');
      } else {
        notify('Invalid username or role credentials.', true);
      }
    }

    function handleLogout() {
      state.currentUser = null;
      saveData();
      navigate('login');
    }

    // --- FACULTY VIEWS ---
    function renderFacultyDashboard() {
      const facId = state.currentUser.faculty_id || 3;
      const faculty = state.faculty.find(f => f.id === facId) || state.faculty[2];
      const dept = state.departments.find(d => d.id === faculty.department_id);
      const departmentName = dept ? dept.name : 'ME';

      // Assigned Courses
      const facCourses = state.faculty_courses.filter(fc => fc.faculty_id === facId);
      let courseRows = '';
      if (facCourses.length > 0) {
        for (const fc of facCourses) {
          const c = state.courses.find(item => item.id === fc.course_id);
          if (c) {
            courseRows += `
              <tr>
                <td>${c.course_code}</td>
                <td>${c.course_name}</td>
                <td>${c.semester}</td>
                <td>${fc.section}</td>
                <td>${c.credits}</td>
                <td>${fc.total_students}</td>
              </tr>`;
          }
        }
      } else {
        courseRows = `<tr><td colspan="6">No courses assigned currently.</td></tr>`;
      }

      // Coursework Assignments
      const facAssignments = state.assignments.filter(a => a.faculty_id === facId);

      const desc = document.getElementById('asgn-desc').value.trim();
      const due = document.getElementById('asgn-due').value.trim();

      const newId = state.assignments.length > 0 ? Math.max(...state.assignments.map(a => a.id)) + 1 : 1;
      state.assignments.unshift({
        id: newId,
        faculty_id: facId,
        course_id: courseId,
        title,
        description: desc,
        due_date: due,

      notify('Assignment created successfully.');
      navigate('faculty/assignments');

      e.preventDefault();
      const code = document.getElementById('add-fcode').value.trim();
      const name = document.getElementById('add-fname').value.trim();
      const email = document.getElementById('add-femail').value.trim();
      const phone = document.getElementById('add-fphone').value.trim();
      const deptId = parseInt(document.getElementById('add-fdept').value, 10);
      const desig = document.getElementById('add-fdesig').value;
      const qual = document.getElementById('add-fqual').value.trim();

      const newId = state.faculty.length > 0 ? Math.max(...state.faculty.map(f => f.id)) + 1 : 1;
      state.faculty.push({
        id: newId,
        faculty_code: code,
        name,
        email,
        phone,
        department_id: deptId,
        designation: desig,
        qualification: qual,
        date_added: '23 Sep 2026'
      });
      saveData();
      notify('Faculty added successfully.');
      navigate('admin/faculty');
    }

    function editFacultyPrompt(id) {
      const f = state.faculty.find(item => item.id === id);
      if (!f) return;
      const newName = prompt('Enter updated name for ' + f.name + ':', f.name);
      if (newName !== null && newName.trim()) {
        f.name = newName.trim();
        saveData();
        notify('Faculty record updated.');
        render();
      }
    }

    function deleteFaculty(id) {
      const f = state.faculty.find(item => item.id === id);
      if (f && confirm('Are you sure you want to delete faculty ' + f.name + '?')) {
        state.faculty = state.faculty.filter(item => item.id !== id);
        saveData();
        notify('Faculty deleted successfully.');
        render();
      }
    }

    function renderAdminDepartments() {
      let rows = '';
      for (const d of state.departments) {
        const hod = state.faculty.find(f => f.id === d.hod_id);
        const count = state.faculty.filter(f => f.department_id === d.id).length;
        rows += `
          <tr>
            <td>${d.id}</td>
            <td>${d.name}</td>
            <td>${hod ? hod.name : 'Not Assigned'}</td>
            <td>${count}</td>
          </tr>`;
      }

      return `
        <h3>Department Management</h3>

        <div style="font-weight: bold; margin: 15px 0 6px 0;">Add Department</div>
        <form onsubmit="handleAddDept(event)">
          <table class="form-table">
            <tr>
              <td style="width: 120px;">Department:</td>
              <td><input type="text" id="dept-name" required placeholder="e.g. IT" style="width: 180px;"></td>
              <td><input type="submit" value="Add"></td>
            </tr>
          </table>
        </form>

        <div style="font-weight: bold; margin-top: 20px; margin-bottom: 6px;">Departments List</div>
        <table class="data-table" style="min-width: 500px;">
          <thead>
            <tr>
              <th style="width: 50px;">ID</th>
              <th style="width: 120px;">Name</th>
              <th style="width: 160px;">HOD</th>
              <th style="width: 90px;">Faculty Count</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    function handleAddDept(e) {
      e.preventDefault();
      const name = document.getElementById('dept-name').value.trim();
      if (!name) return;
      const newId = state.departments.length > 0 ? Math.max(...state.departments.map(d => d.id)) + 1 : 1;
      state.departments.push({ id: newId, name, hod_id: null });
      saveData();
      notify('Department added successfully.');
      render();
    }

    function renderAdminHOD() {
      let rows = '';
      for (const d of state.departments) {
        const hod = state.faculty.find(f => f.id === d.hod_id);
        rows += `
          <tr>
            <td>${d.name}</td>
            <td>${hod ? hod.name : 'Not Assigned'}</td>
            <td>${hod ? hod.email : 'N/A'}</td>
            <td>${hod ? hod.phone : 'N/A'}</td>
          </tr>`;
      }

      let deptOpts = '';
      for (const d of state.departments) {
        deptOpts += `<option value="${d.id}">${d.name}</option>`;
      }
      let facOpts = '';
      for (const f of state.faculty) {
        facOpts += `<option value="${f.id}">${f.name} (${f.faculty_code})</option>`;
      }

      return `
        <h3>HOD Management</h3>

        <div style="font-weight: bold; margin: 15px 0 6px 0;">Assign HOD</div>
        <form onsubmit="handleAssignHOD(event)">
          <table class="form-table">
            <tr>
              <td style="width: 100px;">Department:</td>
              <td>
                <select id="hod-dept" style="width: 160px;">
                  ${deptOpts}
                </select>
              </td>
            </tr>
            <tr>
              <td>Faculty:</td>
              <td>
                <select id="hod-fac" style="width: 220px;">
                  ${facOpts}
                </select>
              </td>
            </tr>
            <tr>
              <td></td>
              <td><input type="submit" value="Assign HOD"></td>
            </tr>
          </table>
        </form>

        <div style="font-weight: bold; margin-top: 20px; margin-bottom: 6px;">Current Department HODs</div>
        <table class="data-table" style="min-width: 550px;">
          <thead>
            <tr>
              <th style="width: 110px;">Department</th>
              <th style="width: 150px;">HOD Name</th>
              <th style="width: 160px;">Email</th>
              <th style="width: 110px;">Phone</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    function handleAssignHOD(e) {
      e.preventDefault();
      const deptId = parseInt(document.getElementById('hod-dept').value, 10);
      const facId = parseInt(document.getElementById('hod-fac').value, 10);
      const dept = state.departments.find(d => d.id === deptId);
      if (dept) {
        dept.hod_id = facId;
        saveData();
        notify('HOD assigned successfully.');
        render();
      }
    }

    function renderAdminTimetable() {
      let rows = '';
      for (const t of state.timetable) {
        const fac = state.faculty.find(f => f.id === t.faculty_id);
        rows += `
          <tr>
            <td>${t.day}</td>
            <td>${t.time}</td>
            <td>${fac ? fac.name : 'N/A'}</td>
            <td>${t.subject}</td>
            <td>${t.room}</td>
            <td><a onclick="deleteTimetable(${t.id})">Delete</a></td>
          </tr>`;
      }

      let facOpts = '';
      for (const f of state.faculty) {
        facOpts += `<option value="${f.id}">${f.name}</option>`;
      }

      return `
        <h3>Timetable Management</h3>

        <div style="font-weight: bold; margin: 15px 0 6px 0;">Add Timetable Entry</div>
        <form onsubmit="handleAddTimetable(event)">
          <table class="form-table">
            <tr>
              <td style="width: 80px;">Day:</td>
              <td>
                <select id="tt-day" style="width: 120px;">
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Time:</td>
              <td><input type="text" id="tt-time" value="09:00-10:00" style="width: 140px;"></td>
            </tr>
            <tr>
              <td>Faculty:</td>
              <td>
                <select id="tt-fac" style="width: 200px;">
                  ${facOpts}
                </select>
              </td>
            </tr>
            <tr>
              <td>Subject:</td>
              <td><input type="text" id="tt-subj" placeholder="e.g. DBMS" required style="width: 140px;"></td>
            </tr>
            <tr>
              <td>Room:</td>
              <td><input type="text" id="tt-room" placeholder="e.g. A-101" required style="width: 100px;"></td>
            </tr>
            <tr>
              <td></td>
              <td><input type="submit" value="Add Schedule"></td>
            </tr>
          </table>
        </form>

        <div style="font-weight: bold; margin-top: 20px; margin-bottom: 6px;">Timetable Schedule</div>
        <table class="data-table" style="min-width: 600px;">
          <thead>
            <tr>
              <th style="width: 70px;">Day</th>
              <th style="width: 110px;">Time</th>
              <th style="width: 140px;">Faculty</th>
              <th style="width: 120px;">Subject</th>
              <th style="width: 80px;">Room</th>
              <th style="width: 60px;">Action</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    function handleAddTimetable(e) {
      e.preventDefault();
      const day = document.getElementById('tt-day').value;
      const time = document.getElementById('tt-time').value.trim();
      const facId = parseInt(document.getElementById('tt-fac').value, 10);
      const subj = document.getElementById('tt-subj').value.trim();
      const room = document.getElementById('tt-room').value.trim();

      const newId = state.timetable.length > 0 ? Math.max(...state.timetable.map(t => t.id)) + 1 : 1;
      state.timetable.push({ id: newId, day, time, faculty_id: facId, subject: subj, room });
      saveData();
      notify('Timetable entry added successfully.');
      render();
    }

    function deleteTimetable(id) {
      if (confirm('Delete this timetable entry?')) {
        state.timetable = state.timetable.filter(t => t.id !== id);
        saveData();
        notify('Timetable entry deleted.');
        render();
      }
    }

    function renderAdminUsers() {
      let rows = '';
      for (const u of state.users) {
        rows += `
          <tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.name}</td>
            <td>${u.role}</td>
            <td>${u.status}</td>
          </tr>`;
      }

      return `
        <h3>User Accounts</h3>
        <table class="data-table" style="min-width: 500px;">
          <thead>
            <tr>
              <th style="width: 50px;">ID</th>
              <th style="width: 120px;">Username</th>
              <th style="width: 150px;">Name</th>
              <th style="width: 100px;">Role</th>
              <th style="width: 80px;">Status</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    // --- HOD VIEWS ---
    function renderHODDashboard() {
      const facId = state.currentUser.faculty_id || 1;
      const hodFac = state.faculty.find(f => f.id === facId) || state.faculty[0];
      const dept = state.departments.find(d => d.id === hodFac.department_id) || state.departments[0];
      const deptFaculty = state.faculty.filter(f => f.department_id === dept.id);

      return `
        <h3>HOD Dashboard</h3>
        <div style="margin: 15px 0; font-size: 15px; line-height: 1.8;">
          <div>HOD Name &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: ${hodFac.name}</div>
          <div>Department &nbsp;&nbsp;&nbsp;&nbsp;: ${dept.name}</div>
          <div>Total Faculty &nbsp;&nbsp;: ${deptFaculty.length}</div>
        </div>

        <div style="font-weight: bold; margin-top: 25px; margin-bottom: 6px;">Department Faculty Overview</div>
        <table class="data-table" style="min-width: 550px;">
          <thead>
            <tr>
              <th style="width: 60px;">ID</th>
              <th style="width: 160px;">Name</th>
              <th style="width: 160px;">Email</th>
              <th style="width: 120px;">Designation</th>
            </tr>
          </thead>
          <tbody>
            ${deptFaculty.slice(0, 5).map(f => `
              <tr>
                <td>${f.faculty_code}</td>
                <td>${f.name}</td>
                <td>${f.email}</td>
                <td>${f.designation}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderHODFaculty() {
      const facId = state.currentUser.faculty_id || 1;
      const hodFac = state.faculty.find(f => f.id === facId) || state.faculty[0];
      const dept = state.departments.find(d => d.id === hodFac.department_id) || state.departments[0];
      const deptFaculty = state.faculty.filter(f => f.department_id === dept.id);

      return `
        <h3>Department Faculty - ${dept.name}</h3>
        <table class="data-table" style="min-width: 650px;">
          <thead>
            <tr>
              <th style="width: 60px;">Code</th>
              <th style="width: 160px;">Name</th>
              <th style="width: 160px;">Email</th>
              <th style="width: 110px;">Phone</th>
              <th style="width: 120px;">Designation</th>
            </tr>
          </thead>
          <tbody>
            ${deptFaculty.map(f => `
              <tr>
                <td>${f.faculty_code}</td>
                <td>${f.name}</td>
                <td>${f.email}</td>
                <td>${f.phone}</td>
                <td>${f.designation}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderHODDepartment() {
      const facId = state.currentUser.faculty_id || 1;
      const hodFac = state.faculty.find(f => f.id === facId) || state.faculty[0];
      const dept = state.departments.find(d => d.id === hodFac.department_id) || state.departments[0];
      const count = state.faculty.filter(f => f.department_id === dept.id).length;

      return `
        <h3>Department Information</h3>
        <div style="margin: 15px 0; font-size: 15px; line-height: 1.8;">
          <div>Department Name : ${dept.name}</div>
          <div>Head of Dept &nbsp;&nbsp;&nbsp;&nbsp;: ${hodFac.name}</div>
          <div>Total Faculty &nbsp;&nbsp;: ${count}</div>
        </div>
      `;
    }

    function renderHODTimetable() {
      const facId = state.currentUser.faculty_id || 1;
      const hodFac = state.faculty.find(f => f.id === facId) || state.faculty[0];
      const dept = state.departments.find(d => d.id === hodFac.department_id) || state.departments[0];
      const deptFacultyIds = state.faculty.filter(f => f.department_id === dept.id).map(f => f.id);
      const timetable = state.timetable.filter(t => deptFacultyIds.includes(t.faculty_id));

      return `
        <h3>Department Timetable - ${dept.name}</h3>
        <table class="data-table" style="min-width: 550px;">
          <thead>
            <tr>
              <th style="width: 70px;">Day</th>
              <th style="width: 110px;">Time</th>
              <th style="width: 150px;">Faculty</th>
              <th style="width: 120px;">Subject</th>
              <th style="width: 80px;">Room</th>
            </tr>
          </thead>
          <tbody>
            ${timetable.map(t => {
              const f = state.faculty.find(item => item.id === t.faculty_id);
              return `
                <tr>
                  <td>${t.day}</td>
                  <td>${t.time}</td>
                  <td>${f ? f.name : 'N/A'}</td>
                  <td>${t.subject}</td>
                  <td>${t.room}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    // --- DIRECTOR / VP / PRESIDENT OVERVIEWS ---
    function renderDirectorDashboard() {
      return `
        <h3>Director Dashboard</h3>
        <div style="margin: 20px 0;">
          <div class="stat-box"><div>Total Faculty</div><div class="stat-number">${state.faculty.length}</div></div>
          <div class="stat-box"><div>Departments</div><div class="stat-number">${state.departments.length}</div></div>
          <div class="stat-box"><div>HODs Assigned</div><div class="stat-number">${state.departments.filter(d=>d.hod_id).length}</div></div>
        </div>
        <div style="font-weight: bold; margin-top: 25px; margin-bottom: 6px;">Department Summary</div>
        <table class="data-table" style="min-width: 500px;">
          <thead><tr><th>Department</th><th>HOD</th><th>Faculty Count</th></tr></thead>
          <tbody>
            ${state.departments.map(d => {
              const hod = state.faculty.find(f => f.id === d.hod_id);
              const count = state.faculty.filter(f => f.department_id === d.id).length;
              return `<tr><td>${d.name}</td><td>${hod ? hod.name : 'Not Assigned'}</td><td>${count}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    function renderVPDashboard() {
      return `
        <h3>Vice President Dashboard</h3>
        <div style="margin: 20px 0;">
          <div class="stat-box"><div>Total Faculty</div><div class="stat-number">${state.faculty.length}</div></div>
          <div class="stat-box"><div>Active Courses</div><div class="stat-number">${state.courses.length}</div></div>
          <div class="stat-box"><div>Timetable Slots</div><div class="stat-number">${state.timetable.length}</div></div>
        </div>
      `;
    }

    function renderPresidentDashboard() {
      return `
        <h3>President Dashboard</h3>
        <div style="margin: 20px 0;">
          <div class="stat-box"><div>Total Faculty</div><div class="stat-number">${state.faculty.length}</div></div>
          <div class="stat-box"><div>Departments</div><div class="stat-number">${state.departments.length}</div></div>
        </div>
      `;
    }

    // ==========================================
    // 4. MAIN LAYOUT AND ROUTE DISPATCHER
    // ==========================================
    function render() {
      const app = document.getElementById('app');

      if (!state.currentUser || currentRoute === 'login') {
        app.innerHTML = renderLogin();
        return;
      }

      const role = state.currentUser.role;
      const navItems = getNavItems(role);

      let sidebarHtml = '';
      for (const item of navItems) {
        const activeClass = currentRoute === item.route ? 'active' : '';
        sidebarHtml += `<div class="sidebar-item ${activeClass}"><a onclick="navigate('${item.route}')">${item.label}</a></div>`;
      }
      sidebarHtml += `<div class="sidebar-item sidebar-logout"><a onclick="handleLogout()">Logout</a></div>`;

      let mainContent = '';
      switch (currentRoute) {
        // Faculty routes
        case 'faculty/dashboard': mainContent = renderFacultyDashboard(); break;
        case 'faculty/profile': mainContent = renderFacultyProfile(); break;
        case 'faculty/profile/edit': mainContent = renderFacultyProfileEdit(); break;
        case 'faculty/courses': mainContent = renderFacultyCourses(); break;
        case 'faculty/assignments': mainContent = renderFacultyAssignments(); break;
        case 'faculty/assignments/add': mainContent = renderFacultyAssignmentForm(); break;
        case 'faculty/attendance': mainContent = renderFacultyAttendance(); break;
        case 'faculty/timetable': mainContent = renderFacultyTimetable(); break;

        // Admin routes
        case 'admin/dashboard': mainContent = renderAdminDashboard(); break;
        case 'admin/faculty': mainContent = renderAdminFaculty(); break;
        case 'admin/faculty/add': mainContent = renderAdminFacultyAdd(); break;
        case 'admin/departments': mainContent = renderAdminDepartments(); break;
        case 'admin/hod': mainContent = renderAdminHOD(); break;
        case 'admin/timetable': mainContent = renderAdminTimetable(); break;
        case 'admin/users': mainContent = renderAdminUsers(); break;

        // HOD routes
        case 'hod/dashboard': mainContent = renderHODDashboard(); break;
        case 'hod/faculty': mainContent = renderHODFaculty(); break;
        case 'hod/department': mainContent = renderHODDepartment(); break;
        case 'hod/timetable': mainContent = renderHODTimetable(); break;

        // Director routes
        case 'director/dashboard': mainContent = renderDirectorDashboard(); break;
        case 'director/faculty': mainContent = renderAdminFaculty(); break;
        case 'director/departments': mainContent = renderAdminDepartments(); break;
        case 'director/hods': mainContent = renderAdminHOD(); break;
        case 'director/timetable': mainContent = renderAdminTimetable(); break;

        // VP routes
        case 'vp/dashboard': mainContent = renderVPDashboard(); break;
        case 'vp/faculty': mainContent = renderAdminFaculty(); break;
        case 'vp/departments': mainContent = renderAdminDepartments(); break;
        case 'vp/hods': mainContent = renderAdminHOD(); break;
        case 'vp/reports': mainContent = renderDirectorDashboard(); break;

        // President routes
        case 'president/dashboard': mainContent = renderPresidentDashboard(); break;
        case 'president/faculty': mainContent = renderAdminFaculty(); break;
        case 'president/departments': mainContent = renderAdminDepartments(); break;
        case 'president/hods': mainContent = renderAdminHOD(); break;

        default:
          if (role === 'Faculty') mainContent = renderFacultyDashboard();
          else if (role === 'HOD') mainContent = renderHODDashboard();
          else mainContent = renderAdminDashboard();
          break;
      }

      app.innerHTML = `
        <div class="header-bar">
          <h2>Faculty Management System</h2>
        </div>

        <div class="layout-container">
          <div class="sidebar">
            <div class="sidebar-menu">
              ${sidebarHtml}
            </div>
          </div>

          <div class="main-content">
            ${bannerMessage ? `<div class="msg-banner">${bannerMessage}</div>` : ''}
            ${bannerError ? `<div class="err-banner">${bannerError}</div>` : ''}
            ${mainContent}
          </div>
        </div>
      `;
    }

    // Initialize application on load
    render();
  </script>
</body>
</html>
