<h3>Timetable Management</h3>

<div style="margin: 10px 0;">
  <a href="#schedule-form">Add Schedule</a>
</div>

<table class="data-table" style="min-width: 600px;">
  <thead>
    <tr>
      <th style="width: 50px;">Day</th>
      <th style="width: 110px;">Time</th>
      <th style="width: 140px;">Faculty</th>
      <th style="width: 110px;">Subject</th>
      <th style="width: 70px;">Room</th>
      <th style="width: 90px;">Action</th>
    </tr>
  </thead>
  <tbody>
    ${rows}
  </tbody>
</table>

<div id="schedule-form" style="margin-top: 25px;">
  <div style="font-weight: bold; margin-bottom: 8px;">${formTitle}</div>
  <form method="POST" action="${formAction}">
    <table class="form-table">
      <tr>
        <td style="width: 100px;">Day:</td>
        <td>
          <select name="day" required style="width: 180px;">
            ${dayOptions}
          </select>
        </td>
      </tr>
      <tr>
        <td>Time:</td>
        <td><input type="text" name="time" placeholder="e.g. 09:00-10:00" value="${editSchedule ? editSchedule.time : ''}" required style="width: 180px;"></td>
      </tr>
      <tr>
        <td>Faculty:</td>
        <td>
          <select name="faculty_id" required style="width: 180px;">
            ${facultyOptions}
          </select>
        </td>
      </tr>
      <tr>
        <td>Subject:</td>
        <td><input type="text" name="subject" placeholder="e.g. DBMS" value="${editSchedule ? editSchedule.subject : ''}" required style="width: 180px;"></td>
      </tr>
      <tr>
        <td>Room:</td>
        <td><input type="text" name="room" placeholder="e.g. A-101" value="${editSchedule ? editSchedule.room : ''}" required style="width: 180px;"></td>
      </tr>
      <tr>
        <td></td>
        <td style="padding-top: 8px;">
          <input type="submit" value="${isEdit ? 'Update Schedule' : 'Submit'}">
          ${isEdit ? `<button type="button" onclick="window.location.href='/admin/timetable'" style="margin-left: 5px;">Cancel</button>` : ''}
        </td>
      </tr>
    </table>
  </form>
</div>
